/* =========================================================

   MAIN CONTAINER
========================================================= */

   SEARCH
========================================================= */

   GRID
========================================================= */

   MAIN FOLDER
========================================================= */

}

.folder-name{

/* =========================================================
   PAGE
========================================================= */

.page.active{

   BACK
========================================================= */

========================================================= */

/* ============================================================
   CATEGORY TYPES

   प्रत्येक Sub-folderला प्रकार मिळतो
============================================================ */

function getType(folder,sub){

    const admit =
        folder === "Admit Card" ||
        sub === "Admit Card" ||
        sub.includes("Admit");

    const result =
        folder === "निकाल" ||
        sub === "निकाल" ||
        sub.includes("निकाल");

    const gr =
        folder === "GR" ||
        sub.includes("GR");

    const education =
        folder === "शालेय शिक्षण" ||
        folder === "महाविद्यालय";

    if(admit)
        return "Admit Card";

    if(result)
        return "निकाल";

    if(gr)
        return "GR / शासन निर्णय";

    if(education)
        return "शैक्षणिक अपडेट";

    return "जाहिरात / परीक्षा";
}



/* ============================================================
   HEADLINE

   पद / परीक्षा / विभागानुसार
============================================================ */

function makeHeadline(folder,sub){

    if(folder === "Admit Card"){

        return sub === "केंद्र"
        ?
        "केंद्र सरकारी परीक्षा — Admit Card"
        :
        "महाराष्ट्र सरकारी परीक्षा — Admit Card";
    }


    if(folder === "निकाल"){

        return sub === "केंद्र"
        ?
        "केंद्र सरकारी परीक्षा — निकाल"
        :
        "महाराष्ट्र सरकारी परीक्षा — निकाल";
    }


    if(folder === "शिक्षक भरती"){

        return sub +
        " — शिक्षक भरती / परीक्षा / जाहिरात अपडेट";
    }


    if(folder === "पोलिस भरती"){

        return sub +
        " — पोलिस भरती जाहिरात / परीक्षा / निकाल";
    }


    if(folder === "महाविद्यालय"){

        return sub +
        " — महाविद्यालयीन शिक्षण / परीक्षा / प्रवेश अपडेट";
    }


    if(folder === "MAHA DBT"){

        return sub +
        " — DBT योजना / अर्ज / अपडेट";
    }


    if(folder === "शालेय शिक्षण"){

        return sub +
        " — शालेय शिक्षण अपडेट";
    }


    if(folder === "GR"){

        return sub +
        " — शासन निर्णय / GR अपडेट";
    }


    if(folder === "Latest Updates"){

        return sub +
        " — नवीनतम अपडेट";
    }


    return sub +
    " — अधिकृत जाहिरात / परीक्षा अपडेट";
}



/* ============================================================
   RECORD GENERATOR

   प्रत्येक Sub-folder रिकामा नाही.
   प्रत्येकासाठी पूर्ण fields तयार होतात.
============================================================ */

function createRecord(folder,sub){

    const key =
        folder + "|" + sub;


    let link =
        specialLinks[key]
        ||
        officialLinks[sub]
        ||
        null;


    return {

        key:key,

        folder:folder,

        sub:sub,

        headline:
        makeHeadline(folder,sub),

        from:
        "अधिकृत जाहिरातीनुसार",

        to:
        "अधिकृत जाहिरातीनुसार",

        type:
        getType(folder,sub),

        link:link,

        status:
        link
        ?
        "Official Source"
        :
        "Official Notification Required"

    };

}



/* ============================================================
   COMPLETE DATABASE

============================================================ */

const database = {};

    folder.subs.forEach(function(sub){

        const record =
        createRecord(
            folder.name,
            sub
        );

        database[record.key] =

    });

});

    .getElementById("page")
    .classList.remove("active");

}



/* ============================================================
   OPEN MAIN FOLDER
============================================================ */

function openFolder(index){

    const folder =
    folders[index];


    document
    .getElementById("home")
    .style.display="none";


    document
    .getElementById("search")
    .style.display="none";


    document
    .getElementById("page")
    .classList.add("active");


    document
    .getElementById("pageTitle")
    .innerText =
    folder.icon +
    " " +
    folder.name;


    document
    .getElementById("subFolders")
    .innerHTML =

        folder.subs
        .map(function(sub,subIndex){

            return `

                <div
                    class="sub-folder"
                    onclick="
                    openSubFolder(
                        ${index},
                        ${subIndex}
                    )"
                >

                    📁 ${sub}

                </div>

            `;

        }).join("");


    document
    .getElementById("details")
    .innerHTML="";

}



/* ============================================================
   OPEN SUB FOLDER
============================================================ */

function openSubFolder(
    folderIndex,
    subIndex
){

    const folder =
    folders[folderIndex];


    const sub =
    folder.subs[subIndex];


    const key =
    folder.name +
    "|" +
    sub;


    const record =
    database[key];


    if(!record){

        return;

    }


    let linkHTML="";


    if(record.link){

        linkHTML = `

            <a
                class="official-link"
                href="${record.link}"
                target="_blank"
                rel="noopener noreferrer"
            >

                🔗 Direct Official Link

            </a>

        `;

    }
    else{

        linkHTML = `

            <div class="note">

                ℹ️ या Sub-folderसाठी
                specific official notification
                उपलब्ध झाल्यावर त्या जाहिरातीची
                Direct Official Link येथे जोडली जाईल.

                <br><br>

                खोटी किंवा अनधिकृत link वापरलेली नाही.

            </div>

        `;

    }


    document
    .getElementById("details")
    .innerHTML = `

        <div class="update-card">

            <h3>
                📌 ${record.headline}
            </h3>


            <div class="update-row">

                📂
                <strong>Main Folder:</strong>
                ${record.folder}

            </div>


            <div class="update-row">

                📁
                <strong>Sub Folder:</strong>
                ${record.sub}

            </div>


            <div class="update-row">

                📢
                <strong>Headline:</strong>
                ${record.headline}

            </div>


            <div class="update-row">

                📅
                <strong>From:</strong>
                ${record.from}

            </div>


            <div class="update-row">

                📅
                <strong>शेवटची तारीख:</strong>
                ${record.to}

            </div>


            <div class="update-row">

                📋
                <strong>प्रकार:</strong>
                ${record.type}

            </div>


            ${linkHTML}


            <br>


            <span class="status">

                ✓ ${record.status}

            </span>


            <div class="note">

                <strong>
                    तारीख नियम:
                </strong>

                विशिष्ट जाहिरात उपलब्ध झाल्यावर
                From आणि शेवटची तारीख
                अधिकृत जाहिरातीतूनच दाखवली जाईल.

                अंदाजे तारीख दाखवली जाणार नाही.

            </div>

        </div>

    `;


    window.scrollTo({

        top:
        document
        .getElementById("details")
        .offsetTop - 20,

        behavior:"smooth"

    });

}



/* ============================================================
   SEARCH
============================================================ */

function searchFolders(){

    const input =
    document
    .getElementById("search")
    .value
    .toLowerCase()
    .trim();


    if(!input){

        renderHome();

        return;

    }


    const results =
    folders.filter(function(folder){

        const mainMatch =
        folder.name
        .toLowerCase()
        .includes(input);


        const subMatch =
        folder.subs.some(function(sub){

            return sub
            .toLowerCase()
            .includes(input);

        });


        return mainMatch || subMatch;

    });


    renderHome(results);

}



/* ============================================================
   GO HOME
============================================================ */

function goHome(){

    document
    .getElementById("page")
    .classList.remove("active");


    document
    .getElementById("home")
    .style.display="block";


    document
    .getElementById("search")
    .style.display="block";


    document
    .getElementById("details")
    .innerHTML="";


    window.scrollTo({

        top:0,

        behavior:"smooth"

    });

}



/* ============================================================
   START
============================================================ */

renderHome();


</script>
